name: Build frontend to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production API if configured
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.VITE_API_BASE_URL?.trim();
          if (!raw) {
            console.log('::warning::Backend not hosted yet. Frontend will publish with data and login unavailable.');
          } else {
            const url = new URL(raw);
            if (url.protocol !== 'https:' || ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
              throw new Error('VITE_API_BASE_URL must point to a public HTTPS API.');
            }
          }
          NODE

      - name: Build website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:pages

      - name: Publish compiled files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: kbmleague.my.id
          enable_jekyll: false
